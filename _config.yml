collections:
  authors:
    output: true

baseurl: ""
url: "https://oboe.github.io/"

highlighter: rouge
input: "GFM"
markdown: kramdown

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# Decorative braille-flow graphic.
#   sides      - wide ribbons in both gutters, dissolving toward the text
#   background - one still, very faint field behind the whole page
#   right      - narrow strip in the right gutter only
#   off        - disabled
braille:
  mode: sides
