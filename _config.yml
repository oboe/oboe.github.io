title: oboe
description: >-
  Short notes on software, systems and whatever else is holding my attention.
author: oboe
lang: en_GB

# All three ship with the github-pages gem, so no Gemfile change is needed.
# seo-tag writes <title>, meta description, Open Graph and Twitter cards, so
# layouts must NOT also hand-roll a <title>.
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

collections:
  authors:
    output: true

baseurl: ""
url: "https://oboe.github.io"   # no trailing slash: it doubles up in canonical/og URLs

highlighter: rouge
input: "GFM"
markdown: kramdown

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# Decorative braille-flow graphic.
#   sides      - wide ribbons in both gutters, dissolving toward the text
#   background - one still, very faint field behind the whole page
#   right      - narrow strip in the right gutter only
#   off        - disabled
braille:
  mode: sides
