---
layout: default
title: Posts
---
<h2>Archive</h2>

<!-- Add tag filter buttons -->
<div class="tag-filter">
  <div class="tag-buttons">
    <button class="tag-button active" data-tag="">All posts</button>
    <button class="tag-button" data-tag="general">Misc</button>
    {% assign tags = site.tags | sort %}
    {% for tag in tags %}
      <button class="tag-button" data-tag="{{ tag[0] }}">{{ tag[0] }}</button>
    {% endfor %}
  </div>
</div>

<div class="archive">
  {% for post in site.posts %} 
    <div class="archive-item" data-tags="{{ post.tags | join: ',' }}">
      <div class="archive-item-title">
        <a href="{{ post.url | relative_url }}?{{ site.time | date: '%s%N' }}" class="archive-title">{{ post.title }}</a>
      </div>
    <div>
      <span class="archive-date">{{ post.date | date: "%b %Y" }}</span>
    </div>
    </div>
  {% endfor %}
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const tagButtons = document.querySelectorAll('.tag-button');
    const archiveItems = document.querySelectorAll('.archive-item');
  
    tagButtons.forEach(button => {
      button.addEventListener('click', function() {
        const selectedTag = this.dataset.tag;
        
        // Update active button
        tagButtons.forEach(btn => btn.classList.remove('active'));
        this.classList.add('active');
        
        // Filter posts
        archiveItems.forEach(function(item) {
          const itemTags = item.dataset.tags.split(',');
          if (selectedTag === '' || itemTags.includes(selectedTag)) {
            item.style.display = '';
          } else if (selectedTag === 'general') {
            item.style.display = itemTags.length === 1 && itemTags[0] === '' ? '' : 'none';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });
  });
</script>

<style>
  .tag-filter {
    margin-bottom: 2rem;
  }

  .tag-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    margin-top: 0.75rem;
  }

  /* Text toggles rather than raised buttons: no fill, no border, no lift. */
  .tag-button {
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #100F0F;
    opacity: 0.55;
    transition: opacity 0.15s ease;
  }

  .tag-button:hover {
    opacity: 1;
  }

  .tag-button.active {
    opacity: 1;
    text-decoration: underline;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.24em;
  }
</style>
